# Runs on every push. Render is set to deploy only after these checks pass,
# so a broken commit never reaches the live demo.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (no API calls)
        run: python -m unittest discover -s tests -v

      - name: Page script parses
        run: |
          python -c "import re; s=open('index.html',encoding='utf-8').read(); open('page.js','w',encoding='utf-8').write(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])"
          node --check page.js

      - name: Docker image builds
        run: docker build -t calldojo .
